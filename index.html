<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ORCA — AI Quote Generator</title>
    <meta
      name="description"
      content="ORCA helps tradespeople generate professional quotes from a simple job description."
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand-wrap">
          <div class="brand-mark">O</div>
          <div>
            <div class="brand-name">ORCA</div>
            <div class="brand-subtitle">Quote Generator</div>
          </div>
        </div>
      </header>

      <main class="page">
        <section id="entryScreen" class="card hero-card">
          <div class="eyebrow">Fast quotes for trades</div>
          <h1>Describe the job</h1>
          <textarea
            id="jobDescription"
            rows="6"
            placeholder="Example: Install 8 electrical sockets, replace the fuse box and run 30m of cable."
            aria-label="Describe the job"
          ></textarea>
          <button id="generateBtn" class="primary-btn" type="button">Generate Quote</button>
        </section>

        <section id="quoteWorkspace" class="workspace hidden" aria-live="polite">
          <div class="card quote-form-card">
            <div class="section-heading-row">
              <h2>Quote details</h2>
              <button id="newQuoteBtn" class="ghost-btn" type="button">New Quote</button>
            </div>

            <div class="details-grid">
              <label>
                <span>Business name</span>
                <input id="businessName" type="text" value="Hawthorne & Co. Building Services" />
              </label>
              <label>
                <span>Quote number</span>
                <input id="quoteNumber" type="text" value="Q-2026-001" />
              </label>
              <label>
                <span>Quote date</span>
                <input id="quoteDate" type="date" />
              </label>
              <label>
                <span>Client name</span>
                <input id="clientName" type="text" value="Mr. and Mrs. Mason" />
              </label>
              <label class="currency-field">
                <span>Currency</span>
                <select id="currency">
                  <option value="GBP">GBP (£)</option>
                  <option value="USD">USD ($)</option>
                  <option value="EUR">EUR (€)</option>
                </select>
              </label>
            </div>
          </div>

          <div class="card table-card">
            <div class="section-heading-row">
              <h2>Quote items</h2>
              <button id="addItemBtn" class="secondary-btn" type="button">Add item</button>
            </div>

            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>Description</th>
                    <th>Qty</th>
                    <th>Unit</th>
                    <th>Unit Price</th>
                    <th>Total</th>
                    <th class="action-col">Action</th>
                  </tr>
                </thead>
                <tbody id="quoteTableBody"></tbody>
              </table>
            </div>

            <div class="totals-box">
              <div class="total-row">
                <span>Subtotal</span>
                <strong id="subtotalValue">£0.00</strong>
              </div>
              <div class="total-row grand-total">
                <span>Grand total</span>
                <strong id="grandTotalValue">£0.00</strong>
              </div>
            </div>
          </div>

          <div class="card preview-card">
            <div class="section-heading-row">
              <h2>Professional preview</h2>
              <button id="printBtn" class="primary-btn" type="button">Print / Save as PDF</button>
            </div>

            <div id="quotePreview" class="quote-preview" aria-live="polite"></div>
          </div>
        </section>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
